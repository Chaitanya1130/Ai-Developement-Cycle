[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc"
version = "0.1.0"
description = "AI-Driven Development Lifecycle CLI (Phase A - Core Execution Engine)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.0.0",
    "click>=8.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
aidlc = "aidlc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

